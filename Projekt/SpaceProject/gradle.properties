# Keep the Gradle daemon and compiler workers within a modest memory budget.
# The default reservation is large enough to exhaust the Windows commit charge
# on machines with many IDE/browser processes running.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
