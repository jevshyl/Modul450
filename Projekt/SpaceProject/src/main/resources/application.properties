spring.application.name=SpaceProject

# --- Web ---
server.port=8080
app.cli.enabled=false
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# --- Solar System API ---
solar.api.base-url=https://api.le-systeme-solaire.net/rest
solar.api.key=${SOLAR_API_KEY:b6e1b887-386c-4d24-a776-2b094fe3afda}

spring.datasource.url=jdbc:h2:file:./data/spaceproject
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=user

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console